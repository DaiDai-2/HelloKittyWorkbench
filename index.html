<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFB6C1">
<title>HelloKitty 个人工作台</title>
<link rel="manifest" href="manifest.json">

<style>
/* ===== Hello Kitty 主题设计系统 ===== */
:root{
  --pink-light:#FFF0F3;
  --pink:#FFB6C1;
  --pink-mid:#FF85A2;
  --pink-deep:#FF69B4;
  --pink-dark:#E0559A;
  --white:#FFFFFF;
  --bg:#FDF2F5;
  --card-bg:#FFFFFF;
  --text:#4A3040;
  --text-secondary:#8B7280;
  --text-light:#B09AAA;
  --border:#F0DFE5;
  --shadow:0 2px 12px rgba(255,105,180,0.08);
  --shadow-lg:0 8px 30px rgba(255,105,180,0.12);
  --radius:20px;
  --radius-sm:12px;
  --radius-xs:8px;
  --font:'SF Pro Rounded',-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --tab-height:64px;
  --header-height:52px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  height:100%;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;
  user-select:none;
}
#app{
  display:flex;
  flex-direction:column;
  height:100%;
  max-width:600px;
  margin:0 auto;
  position:relative;
  overflow:hidden;
}

/* 顶部导航 */
.app-header{
  background:var(--white);
  padding:8px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  height:var(--header-height);
  z-index:100;
}
.app-title{
  font-size:17px;
  font-weight:700;
  color:var(--pink-deep);
  letter-spacing:1px;
}
.header-icons{display:flex;gap:12px;align-items:center;}
.icon-btn{
  width:34px;height:34px;
  border-radius:50%;
  border:none;
  background:var(--pink-light);
  color:var(--pink-deep);
  font-size:16px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .15s;
}
.icon-btn:active{transform:scale(.88);}

/* 内容区 */
.content-area{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:12px 14px;
  padding-bottom:8px;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
.content-area::-webkit-scrollbar{width:0;}

/* 底部TabBar */
.tab-bar{
  display:flex;
  background:var(--white);
  border-top:1px solid var(--border);
  flex-shrink:0;
  height:calc(var(--tab-height) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  z-index:100;
}
.tab-item{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  border:none;
  background:none;
  color:var(--text-light);
  font-size:11px;
  font-weight:500;
  cursor:pointer;
  transition:all .2s;
  font-family:var(--font);
  position:relative;
}
.tab-item .tab-icon{font-size:22px;transition:transform .2s;}
.tab-item.active{color:var(--pink-deep);}
.tab-item.active .tab-icon{transform:scale(1.1);}
.tab-item.active::before{
  content:'';
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:24px;
  height:3px;
  background:var(--pink-deep);
  border-radius:0 0 3px 3px;
}

/* 面板 */
.tab-panel{display:none;animation:fadeInUp .3s ease;}
.tab-panel.active{display:block;}
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}

/* 卡片 */
.card{
  background:var(--card-bg);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
  transition:transform .15s;
}
.card:active{transform:scale(.985);}
.card-header{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
  font-weight:600;
  font-size:15px;
  color:var(--text);
}
.card-header .em{font-size:20px;}

/* 按钮 */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:10px 20px;
  border-radius:25px;
  border:none;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
  font-family:var(--font);
}
.btn:active{transform:scale(.95);}
.btn-primary{
  background:linear-gradient(135deg,var(--pink-deep),var(--pink));
  color:#FFF;
  box-shadow:0 4px 14px rgba(255,105,180,.3);
}
.btn-secondary{
  background:var(--pink-light);
  color:var(--pink-deep);
}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:18px;}
.btn-xs{padding:4px 10px;font-size:11px;border-radius:14px;}
.btn-block{width:100%;}

/* 表单 */
.input{
  width:100%;
  padding:10px 16px;
  border:2px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:14px;
  font-family:var(--font);
  background:var(--white);
  color:var(--text);
  transition:border-color .2s;
  outline:none;
}
.input:focus{border-color:var(--pink);}
.input-row{display:flex;gap:8px;margin-bottom:10px;}
.input-row .input{flex:1;}
.select{
  width:100%;
  padding:10px 16px;
  border:2px solid var(--border);
  border-radius:var(--radius-sm);
  font-size:14px;
  font-family:var(--font);
  background:var(--white);
  color:var(--text);
  outline:none;
}

/* 列表项 */
.list-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.list-item:last-child{border-bottom:none;}
.list-item-left{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;}
.list-item-title{font-weight:600;font-size:14px;}
.list-item-sub{font-size:12px;color:var(--text-secondary);}
.list-item-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.list-item-badge{
  font-weight:700;
  font-size:14px;
  color:var(--pink-deep);
}

/* 标签 */
.tag{
  display:inline-block;
  padding:3px 10px;
  border-radius:14px;
  font-size:11px;
  font-weight:600;
  margin:2px;
}
.tag-pink{background:var(--pink-light);color:var(--pink-deep);}
.tag-green{background:#E8F5E9;color:#4CAF50;}
.tag-orange{background:#FFF3E0;color:#FF9800;}
.tag-purple{background:#F3E5F5;color:#9C27B0;}
.tag-blue{background:#E3F2FD;color:#2196F3;}

/* 进度条 */
.progress-bar{
  width:100%;
  height:10px;
  background:var(--pink-light);
  border-radius:5px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--pink-deep),var(--pink));
  border-radius:5px;
  transition:width .4s ease;
}
.progress-ring{
  position:relative;
  width:80px;height:80px;
  margin:0 auto;
}
.progress-ring svg{transform:rotate(-90deg);}

/* 网格 */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

/* 统计数字 */
.stat-num{font-size:28px;font-weight:800;color:var(--pink-deep);}
.stat-label{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.stat-card{text-align:center;padding:14px 8px;}

/* 心情 */
.mood-picker{display:flex;justify-content:space-around;padding:8px 0;}
.mood-item{
  font-size:36px;
  padding:8px;
  border-radius:50%;
  cursor:pointer;
  transition:all .2s;
  border:3px solid transparent;
}
.mood-item.selected{border-color:var(--pink-deep);background:var(--pink-light);transform:scale(1.15);}

/* 日历 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal-day-header{font-size:11px;color:var(--text-secondary);padding:4px 0;}
.cal-day{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  border-radius:50%;
  cursor:pointer;
  transition:all .2s;
}
.cal-day.today{background:var(--pink);color:#FFF;font-weight:700;}
.cal-day.done{background:var(--pink-light);font-weight:600;}
.cal-day.happy{background:#FFB6C1;color:#FFF;}
.cal-day.neutral{background:#E8E8E8;}
.cal-day.sad{background:#C8C8C8;}

/* 热力图 */
.heatmap{display:flex;gap:3px;flex-wrap:wrap;}
.heatmap-cell{
  width:14px;height:14px;
  border-radius:3px;
  background:#F0F0F0;
}
.heatmap-cell.l1{background:var(--pink-light);}
.heatmap-cell.l2{background:var(--pink);}
.heatmap-cell.l3{background:var(--pink-mid);}
.heatmap-cell.l4{background:var(--pink-deep);}

/* 底部表单栏 */
.bottom-sheet{
  position:fixed;
  bottom:0;left:0;right:0;
  background:var(--white);
  border-radius:var(--radius) var(--radius) 0 0;
  padding:20px 16px calc(20px + var(--safe-bottom));
  box-shadow:0 -4px 20px rgba(0,0,0,.1);
  z-index:200;
  transform:translateY(100%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  max-width:600px;
  margin:0 auto;
}
.bottom-sheet.show{transform:translateY(0);}
.sheet-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:199;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s;
}
.sheet-overlay.show{opacity:1;pointer-events:auto;}

/* 更多页面二级导航 */
.sub-nav{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:6px 0 10px;
  scrollbar-width:none;
}
.sub-nav::-webkit-scrollbar{display:none;}
.sub-nav-btn{
  flex-shrink:0;
  padding:8px 18px;
  border-radius:20px;
  border:none;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  background:var(--pink-light);
  color:var(--pink-dark);
  font-family:var(--font);
  transition:all .2s;
}
.sub-nav-btn.active{background:var(--pink-deep);color:#FFF;}

/* 设置页面 */
.settings-page{
  position:fixed;
  inset:0;
  background:var(--bg);
  z-index:300;
  transform:translateX(100%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  max-width:600px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
}
.settings-page.show{transform:translateX(0);}
.settings-header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 16px;
  background:var(--white);
  border-bottom:1px solid var(--border);
}
.settings-body{flex:1;overflow-y:auto;padding:16px;}

/* 动画 */
@keyframes popIn{
  0%{transform:scale(.5);opacity:0;}
  60%{transform:scale(1.1);}
  100%{transform:scale(1);opacity:1;}
}
@keyframes checkBounce{
  0%{transform:scale(.3);opacity:0;}
  50%{transform:scale(1.3);}
  100%{transform:scale(1);opacity:1;}
}
.animate-pop{animation:popIn .4s ease;}
.animate-check{animation:checkBounce .5s ease;}

/* 删除按钮样式 */
.btn-del{
  background:#FFE0E0;
  color:#E04040;
}
.btn-del:active{background:#FFCCCC;}

/* 空状态 */
.empty-state{
  text-align:center;
  padding:40px 20px;
  color:var(--text-light);
}
.empty-state .em{font-size:48px;display:block;margin-bottom:10px;}

/* Toast */
.toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--text);
  color:#FFF;
  padding:10px 24px;
  border-radius:25px;
  font-size:14px;
  font-weight:600;
  z-index:999;
  opacity:0;
  transition:opacity .3s;
  pointer-events:none;
}
.toast.show{opacity:1;}
</style>
</head>

// ===== 工具函数 =====
function todayStr(){return new Date().toISOString().split('T')[0];}
function nowStr(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(d){return new Date(d).toLocaleDateString('zh-CN');}
function fmtDateShort(d){return new Date(d).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});}
function fmtMoney(n){return '¥'+(+n).toFixed(2);}
function fmtKcal(n){return (+n).toFixed(0)+' kcal';}
function fmtPercent(n,t){return t>0?(n/t*100).toFixed(1)+'%':'0%';}
function daysBetween(a,b){return Math.ceil((new Date(b)-new Date(a))/86400000);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

function getExerciseStreak(){
  const records=DB.get('exerciseRecords',[]);
  const dates=[...new Set(records.map(r=>r.date))].sort().reverse();
  if(dates.length===0)return 0;
  let streak=0;
  let d=new Date(todayStr());
  for(let i=0;;i++){
    const s=dates.includes(d.toISOString().split('T')[0]);
    if(s){streak++;d.setDate(d.getDate()-1);}else break;
  }
  return streak;
}

function calcBMI(weight,height){
  const h=height/100;
  const bmi=(weight/(h*h)).toFixed(1);
  let label='';
  if(bmi<18.5)label='偏瘦';else if(bmi<24)label='正常';else if(bmi<28)label='偏胖';else label='肥胖';
  return bmi+' ('+label+')';
}

function searchFood(){
  const q=document.getElementById('foodSearch').value.trim();
  const el=document.getElementById('foodResult');
  if(!q){el.innerHTML='';return;}
  const match=Object.entries(FOOD_DB).find(([k])=>k.includes(q));
  if(match){
    el.innerHTML='<span style="color:var(--pink-deep);font-weight:600;">'+match[0]+'</span> ≈ '+match[1].kcal+' kcal ('+match[1].unit+') ';
    el.innerHTML+='<button class="btn btn-xs btn-primary" onclick="addFromSearch(\''+match[0]+'\','+match[1].kcal+',\''+match[1].unit+'\')">记入饮食</button>';
  }else{
    el.innerHTML='<span style="color:#E04040;">未找到「'+q+'」，请手动输入热量</span>';
  }
}

function addFromSearch(name,kcal,unit){
  const records=DB.get('dietRecords',[]);
  records.push({id:DB.uid(),foodName:name,calories:kcal,portion:unit,time:nowStr(),date:todayStr()});
  DB.set('dietRecords',records);
  showToast('已添加: '+name);
  renderContent();
}

function addDiet(){
  const name=document.getElementById('dietFood').value.trim();
  const kcal=parseFloat(document.getElementById('dietKcal').value);
  const portion=document.getElementById('dietPortion').value.trim()||'1份';
  if(!name||isNaN(kcal)){showToast('请填写食物名称和热量');return;}
  const records=DB.get('dietRecords',[]);
  records.push({id:DB.uid(),foodName:name,calories:kcal,portion:portion,time:nowStr(),date:todayStr()});
  DB.set('dietRecords',records);
  showToast('已添加: '+name);
  renderContent();
}

function deleteDiet(id){
  if(!confirm('确定删除这条饮食记录？'))return;
  let records=DB.get('dietRecords',[]);
  records=records.filter(r=>r.id!==id);
  DB.set('dietRecords',records);
  showToast('已删除');
  renderContent();
}

function addWater(amount=250){

  records.push({id:DB.uid(),amount:amount,time:nowStr(),date:todayStr()});
  DB.set('waterRecords',records);

  renderContent();
}

  const totalOwe=debts.filter(d=>d.debtType==='owe'&&!d.isPaid).reduce((s,d)=>s+(+d.amount||0),0);

  // 月度汇总

  html+='<div class="stat-card"><div class="stat-num" style="color:#4CAF50;">'+fmtMoney(monthIncome)+'</div><div class="stat-label">收入</div></div>';
  html+='<div class="stat-card"><div class="stat-num" style="color:#E04040;">'+fmtMoney(monthExpense)+'</div><div class="stat-label">支出</div></div>';

  html+='</div></div>';

  // 添加收支
  html+='<div class="card"><div class="card-header"><span class="em">💳</span>添加收支记录</div>';
  html+='<div class="input-row"><button class="btn btn-primary" id="txTypeBtn" onclick="toggleTxType()" style="flex:.4;">💰 支出</button>';
  html+='<input class="input" id="txAmount" placeholder="金额" type="number" style="flex:.8;">';
  html+='<input class="input" id="txDate" type="date" value="'+today+'" style="flex:.7;"></div>';
  html+='<div style="margin-bottom:8px;"><select class="select" id="txCategory"></select></div>';
  html+='<input class="input" id="txNote" placeholder="备注(选填)" style="margin-bottom:8px;">';
  html+='<button class="btn btn-primary btn-block" onclick="addTransaction()">添加记录</button></div>';

  // 收支列表
  html+='<div class="card"><div class="card-header"><span class="em">📋</span>最近收支</div>';
  const recentTx=transactions.filter(t=>t.date>=monthStart).sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time)).slice(0,10);
  if(recentTx.length===0){html+='<div class="empty-state"><span class="em">💰</span><div>本月还没有记录</div></div>';}
  else{recentTx.forEach(t=>{
    const isIncome=t.type==='income';
    html+='<div class="list-item"><div class="list-item-left"><div class="list-item-title">'+(isIncome?'📥':'📤')+' '+t.category+'</div><div class="list-item-sub">'+t.date+' '+(t.time||'')+' · '+t.note+'</div></div>';
    html+='<div class="list-item-right"><span class="list-item-badge" style="color:'+(isIncome?'#4CAF50':'#E04040')+';">'+(isIncome?'+':'−')+fmtMoney(t.amount)+'</span>';
    html+='<button class="btn btn-del btn-xs" onclick="deleteTx(\''+t.id+'\')">删</button></div></div>';
  });}
  html+='</div>';

  // 预算规划
  html+='<div class="card"><div class="card-header"><span class="em">📐</span>50/30/20 预算规划</div>';
  html+='<label style="font-size:13px;color:var(--text-secondary);">月工资收入</label>';
  html+='<input class="input" id="budgetSalary" type="number" value="'+budgetPlan.monthlySalary+'" placeholder="输入月工资金额" onchange="updateBudget()" style="margin-bottom:8px;">';
  const needs=(budgetPlan.monthlySalary*budgetPlan.needsPercent/100);
  const wants=(budgetPlan.monthlySalary*budgetPlan.wantsPercent/100);
  const savings=(budgetPlan.monthlySalary*budgetPlan.savingsPercent/100);

  html+='<div style="font-size:13px;line-height:2;">🟡 个人想要 '+budgetPlan.wantsPercent+'%: <b>'+fmtMoney(wants)+'</b></div>';

  html+='</div>';

  // 存钱目标
  html+='<div class="card"><div class="card-header"><span class="em">🎯</span>存钱目标</div>';

  html+='<input class="input" id="goalDate" type="date" value="'+savingsGoal.targetDate+'"></div>';
  html+='<button class="btn btn-primary btn-block" onclick="saveSavingsGoal()" style="margin-bottom:6px;">💾 保存目标</button>';
  html+='<div class="input-row"><input class="input" id="saveAmount" type="number" placeholder="存入金额">';
  html+='<button class="btn btn-secondary" onclick="addSavings()">存入</button></div></div>';

    html+='<div class="progress-bar" style="margin-bottom:6px;"><div class="progress-fill" style="width:'+Math.min(100,savingPct)+'%"></div></div>';

}

let txType='expense';
function toggleTxType(){
  txType=txType==='expense'?'income':'expense';
  document.getElementById('txTypeBtn').textContent=txType==='expense'?'💰 支出':'💵 收入';
  renderTxCategories();
}
function renderTxCategories(){
  const sel=document.getElementById('txCategory');
  if(!sel)return;
  const cats=DB.get('txCategories',[]).filter(c=>c.type===txType);
  sel.innerHTML=cats.map(c=>'<option>'+c.name+'</option>').join('');
}
function addTransaction(){
  const amount=parseFloat(document.getElementById('txAmount').value);
  const category=document.getElementById('txCategory').value;
  const note=document.getElementById('txNote').value.trim();
  const date=document.getElementById('txDate').value;
  if(isNaN(amount)||!category){showToast('请填写金额和分类');return;}
  const tx=DB.get('transactions',[]);
  tx.push({id:DB.uid(),type:txType,amount:amount,category:category,note:note,date:date,time:nowStr()});
  DB.set('transactions',tx);
  showToast('已添加记录');
  renderContent();
}
function deleteTx(id){
  if(!confirm('确定删除？'))return;
  let tx=DB.get('transactions',[]);
  DB.set('transactions',tx.filter(t=>t.id!==id));
  renderContent();
}
function updateBudget(){
  const plan=DB.get('budgetPlan',{monthlySalary:0,needsPercent:50,wantsPercent:30,savingsPercent:20});
  plan.monthlySalary=parseFloat(document.getElementById('budgetSalary').value)||0;
  DB.set('budgetPlan',plan);
  renderContent();
}
function saveSavingsGoal(){
  const goal=DB.get('savingsGoal',{targetName:'',targetAmount:0,currentAmount:0,targetDate:'',records:[]});
  goal.targetName=document.getElementById('goalName').value.trim();
  goal.targetAmount=parseFloat(document.getElementById('goalAmount').value)||0;
  goal.targetDate=document.getElementById('goalDate').value;
  DB.set('savingsGoal',goal);
  showToast('目标已保存');
  renderContent();
}
function addSavings(){
  const amount=parseFloat(document.getElementById('saveAmount').value);
  if(isNaN(amount)||amount<=0){showToast('请输入金额');return;}
  const goal=DB.get('savingsGoal',{targetName:'',targetAmount:0,currentAmount:0,targetDate:'',records:[]});
  goal.currentAmount+=amount;
  if(!goal.records)goal.records=[];
  goal.records.push({amount:amount,date:todayStr()});
  DB.set('savingsGoal',goal);
  showToast('已存入 '+fmtMoney(amount));
  renderContent();
}
function addDebt(){
  const type=document.getElementById('debtType').value;
  const person=document.getElementById('debtPerson').value.trim();
  const amount=parseFloat(document.getElementById('debtAmount').value);
  const note=document.getElementById('debtNote').value.trim();
  if(!person||isNaN(amount)){showToast('请填写对方和金额');return;}
  const debts=DB.get('debts',[]);
  debts.push({id:DB.uid(),debtType:type,personName:person,amount:amount,note:note,date:todayStr(),isPaid:false});
  DB.set('debts',debts);
  showToast('已添加欠款记录');
  renderContent();
}
function markDebtPaid(id){
  const debts=DB.get('debts',[]);
  const d=debts.find(d=>d.id===id);
  if(d){d.isPaid=true;DB.set('debts',debts);showToast('已标记为已还');renderContent();}
}
function deleteDebt(id){
  if(!confirm('确定删除？'))return;
  let debts=DB.get('debts',[]);
  DB.set('debts',debts.filter(d=>d.id!==id));
  renderContent();
}

function renderHealth(){
  const today=todayStr();
  const exercises=DB.get('exerciseRecords',[]);
  const weekStart=new Date();weekStart.setDate(weekStart.getDate()-weekStart.getDay()+1);
  const ws=weekStart.toISOString().split('T')[0];
  const weekEx=exercises.filter(r=>r.date>=ws);
  const weekCount=weekEx.length;
  const weekDuration=weekEx.reduce((s,r)=>s+(+r.duration||0),0);
  const weekKcal=weekEx.reduce((s,r)=>s+(+r.caloriesBurned||0),0);
  const streak=getExerciseStreak();

  const weightRecords=DB.get('weightRecords',[]);
  const weightProfile=DB.get('weightProfile',{gender:'female',height:165,birthYear:2000});
  const latestWeight=weightRecords.length>0?weightRecords[weightRecords.length-1]:null;

  let html='';

  // 运动打卡
  html+='<div class="card"><div class="card-header"><span class="em">🏋️</span>运动打卡</div>';

  html+='<div class="stat-card"><div class="stat-num">'+streak+'</div><div class="stat-label">连续天数🔥</div></div>';
  html+='</div>';
  html+='<button class="btn btn-primary btn-block" onclick="openExerciseForm()">➕ 添加运动记录</button></div>';

  // 运动日历
  html+='<div class="card"><div class="card-header"><span class="em">📅</span>运动日历</div>'+renderMiniCalendar(true)+'</div>';

  // 最近运动记录
  html+='<div class="card"><div class="card-header"><span class="em">📋</span>最近运动</div>';
  const recent=exercises.sort((a,b)=>b.date.localeCompare(a.date)||b.time?.localeCompare(a.time||'')).slice(0,8);
  if(recent.length===0){html+='<div class="empty-state"><span class="em">🏃</span><div>还没有运动记录</div></div>';}
  else{recent.forEach(e=>{
    html+='<div class="list-item"><div class="list-item-left"><div class="list-item-title">'+e.exerciseName+' ('+e.exerciseType+')</div><div class="list-item-sub">'+e.date+' · '+e.duration+'分钟 · '+e.caloriesBurned+' kcal</div></div>';
    html+='<div class="list-item-right"><button class="btn btn-del btn-xs" onclick="deleteExercise(\''+e.id+'\')">删</button></div></div>';
  });}
  html+='</div>';

  // 体重记录
  html+='<div class="card"><div class="card-header"><span class="em">⚖️</span>体重记录</div>';
  html+='<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">性别: '+weightProfile.gender+' | 身高: '+weightProfile.height+'cm | 出生: '+weightProfile.birthYear+'</div>';
  html+='<div class="input-row"><input class="input" id="weightInput" type="number" step="0.1" placeholder="体重(kg)">';
  html+='<button class="btn btn-primary" onclick="addWeight()">记录</button></div>';
  if(latestWeight){
    const bmi=calcBMI(latestWeight.weight,weightProfile.height);
    const bodyFat=estimateBodyFat(latestWeight.weight,weightProfile.height,weightProfile.gender,weightProfile.birthYear);
    const stdWeight=estimateStdWeight(weightProfile.height,weightProfile.gender);
    html+='<div class="grid-2" style="margin-top:10px;">';
    html+='<div class="stat-card card"><div class="stat-num">'+latestWeight.weight+'</div><div class="stat-label">最新体重(kg)</div></div>';
    html+='<div class="stat-card card"><div class="stat-num">'+bmi+'</div><div class="stat-label">BMI</div></div>';
    html+='<div class="stat-card card"><div class="stat-num">'+bodyFat.toFixed(1)+'%</div><div class="stat-label">估算体脂率</div></div>';
    html+='<div class="stat-card card"><div class="stat-num">'+stdWeight.toFixed(1)+'</div><div class="stat-label">标准体重(kg)</div></div>';
    html+='</div>';
  }
  // 体重趋势
  if(weightRecords.length>=2){
    html+='<div style="margin-top:10px;">';
    html+='<div style="font-size:13px;font-weight:600;">体重趋势 (最近7天)</div>';
    const recent7=weightRecords.slice(-7);
    const minW=Math.min(...recent7.map(r=>r.weight));
    const maxW=Math.max(...recent7.map(r=>r.weight));
    const range=maxW-minW||1;
    html+='<div style="display:flex;align-items:flex-end;gap:4px;height:80px;padding:8px 0;">';
    recent7.forEach(r=>{
      const h=(r.weight-minW)/range*60+10;
      html+='<div style="flex:1;text-align:center;"><div style="background:var(--pink);height:'+h+'px;border-radius:6px 6px 0 0;min-height:4px;"></div><div style="font-size:9px;margin-top:2px;">'+r.weight+'</div><div style="font-size:8px;color:var(--text-light);">'+fmtDateShort(r.date)+'</div></div>';
    });
    html+='</div></div>';
  }
  html+='</div>';

  return html;
}

function estimateBodyFat(weight,height,gender,birthYear){
  const bmi=weight/((height/100)*(height/100));
  const age=new Date().getFullYear()-birthYear;
  if(gender==='male')return (1.20*bmi)+(0.23*age)-16.2;
  return (1.20*bmi)+(0.23*age)-5.4;
}
function estimateStdWeight(height,gender){
  if(gender==='male')return (height-80)*0.7;
  return (height-70)*0.6;
}

function addExercise(){
  const type=document.getElementById('exType').value;
  let name=document.getElementById('exName').value;
  const custom=document.getElementById('exCustom').value.trim();

  const duration=parseFloat(document.getElementById('exDuration').value);

  const records=DB.get('exerciseRecords',[]);
  records.push({id:DB.uid(),exerciseType:type,exerciseName:name,duration:duration,caloriesBurned:cal,note:note,date:date,time:nowStr()});
  DB.set('exerciseRecords',records);
  closeSheet();
  showToast('运动打卡成功! ✅');

function renderMiniCalendar(forExercise){
  const today=new Date();
  const y=today.getFullYear(),m=today.getMonth();
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const weekdays=['日','一','二','三','四','五','六'];

  let html='<div class="cal-grid">';
  weekdays.forEach(d=>{html+='<div class="cal-day-header">'+d+'</div>';});
  for(let i=0;i<firstDay;i++){html+='<div></div>';}
  for(let d=1;d<=daysInMonth;d++){
    const ds=y+'-'+(m+1).toString().padStart(2,'0')+'-'+d.toString().padStart(2,'0');
    let cls='cal-day';
    if(d===today.getDate())cls+=' today';
    if(forExercise){
      const records=DB.get('exerciseRecords',[]);
      if(records.some(r=>r.date===ds))cls+=' done';
    }
    html+='<div class="'+cls+'">'+d+'</div>';
  }
  html+='</div>';
  return html;
}

  html+='</div>';

  switch(moreSubTab){
    case 'reading':html+=renderReading();break;
    case 'study':html+=renderStudy();break;
    case 'habit':html+=renderHabit();break;
    case 'mood':html+=renderMood();break;
  }
  return html;
}
function switchMoreSub(id){moreSubTab=id;renderContent();}

// ===== 模块4：读书 =====
function renderReading(){
  const books=DB.get('books',[]);
  const notes=DB.get('readingNotes',[]);
  const contents=DB.get('readingContents',[]);
  const cats=[...new Set(books.map(b=>b.category))];

  let html='<div class="card"><div class="card-header"><span class="em">📚</span>书单推荐 ('+books.length+'本)</div>';
  html+='<div style="margin-bottom:8px;"><select class="select" id="bookFilter" onchange="filterBooks()"><option value="">全部分类</option>';
  cats.forEach(c=>{html+='<option>'+c+'</option>';});
  html+='</select></div>';
  html+='<div id="bookList">'+renderBookList(books,'')+'</div></div>';

  // 在线读书区
  html+='<div class="card"><div class="card-header"><span class="em">📖</span>在线读书区</div>';
  if(contents.length>0){
    contents.forEach(c=>{
      html+='<div class="list-item" onclick="openReader(\''+c.id+'\')"><div class="list-item-left"><div class="list-item-title">'+c.title+'</div><div class="list-item-sub">页数: '+c.currentPage+' | '+fmtDate(c.date||c.createdAt)+'</div></div>';
      html+='<div class="list-item-right"><button class="btn btn-del btn-xs" onclick="event.stopPropagation();deleteContent(\''+c.id+'\')">删</button></div></div>';
    });
  }
  html+='<button class="btn btn-secondary btn-block" onclick="openNewContent()">➕ 新建阅读内容</button></div>';

  // 阅读笔记
  html+='<div class="card"><div class="card-header"><span class="em">📝</span>阅读笔记</div>';
  html+='<input class="input" id="noteSearch" placeholder="搜索笔记关键词..." oninput="searchNotes()" style="margin-bottom:8px;">';
  html+='<div id="noteList">'+renderNoteList(notes)+'</div>';
  html+='<button class="btn btn-secondary btn-block" onclick="openAddNote()">➕ 添加笔记</button></div>';

  return html;
}

function renderBookList(books,filterCat){
  let html='';const filtered=filterCat?books.filter(b=>b.category===filterCat):books;
  filtered.forEach(b=>{
    const statusLabel={want:'想读',reading:'在读',done:'已读'};
    const pct=b.totalPages>0?(b.currentPage/b.totalPages*100):0;
    html+='<div class="card" style="border-left:5px solid '+b.coverColor+';margin-bottom:8px;cursor:pointer;" onclick="toggleBookDetail(\''+b.id+'\')">';
    html+='<div style="display:flex;justify-content:space-between;align-items:start;"><div><div style="font-weight:700;">'+b.title+'</div><div style="font-size:12px;color:var(--text-secondary);">'+b.author+'</div>';
    html+='<div style="margin-top:4px;"><span class="tag tag-pink">'+b.category+'</span><span class="tag tag-purple">'+({beginner:'入门',intermediate:'进阶',advanced:'深度'}[b.difficulty])+'</span></div>';
    html+='<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">💡 '+b.recommendation+'</div></div>';
    html+='<span style="font-size:11px;color:var(--pink-deep);">'+statusLabel[b.readStatus]+'</span></div>';
    html+='<div id="bookDetail_'+b.id+'" style="display:none;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">';
    html+='<div style="margin-bottom:6px;"><button class="btn btn-xs '+(b.readStatus==='want'?'btn-primary':'btn-secondary')+'" onclick="event.stopPropagation();setBookStatus(\''+b.id+'\',\'want\')">想读</button> ';
    html+='<button class="btn btn-xs '+(b.readStatus==='reading'?'btn-primary':'btn-secondary')+'" onclick="event.stopPropagation();setBookStatus(\''+b.id+'\',\'reading\')">在读</button> ';
    html+='<button class="btn btn-xs '+(b.readStatus==='done'?'btn-primary':'btn-secondary')+'" onclick="event.stopPropagation();setBookStatus(\''+b.id+'\',\'done\')">已读</button></div>';
    if(b.readStatus==='reading'){
      html+='<div style="font-size:12px;margin-bottom:4px;">进度: '+b.currentPage+'/'+b.totalPages+' 页</div>';
      html+='<div class="progress-bar" style="margin-bottom:4px;"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
      html+='<div class="input-row"><input class="input" id="page_'+b.id+'" type="number" placeholder="当前页数" value="'+b.currentPage+'" style="flex:.6;">';
      html+='<button class="btn btn-xs btn-primary" onclick="event.stopPropagation();updatePage(\''+b.id+'\')">更新</button></div>';
    }
    const bNotes=DB.get('readingNotes',[]).filter(n=>n.bookId===b.id);
    if(bNotes.length>0){
      html+='<div style="font-size:12px;margin-top:4px;color:var(--text-secondary);">📝 '+bNotes.length+' 条笔记</div>';
    }
    html+='</div></div>';
  });
  return html||'<div class="empty-state"><span class="em">📚</span><div>没有找到书籍</div></div>';
}

function toggleBookDetail(id){
  const el=document.getElementById('bookDetail_'+id);
  if(el)el.style.display=el.style.display==='none'?'block':'none';
}
function filterBooks(){
  const cat=document.getElementById('bookFilter').value;
  document.getElementById('bookList').innerHTML=renderBookList(DB.get('books',[]),cat);
}
function setBookStatus(id,status){
  const books=DB.get('books',[]);
  const b=books.find(b=>b.id===id);
  if(b){b.readStatus=status;DB.set('books',books);showToast('状态已更新');renderContent();}
}
function updatePage(id){
  const page=parseInt(document.getElementById('page_'+id).value);
  if(isNaN(page))return;
  const books=DB.get('books',[]);
  const b=books.find(b=>b.id===id);
  if(b){b.currentPage=page;DB.set('books',books);showToast('进度已更新');renderContent();}
}

function renderNoteList(notes,keyword=''){
  let filtered=notes;
  if(keyword)filtered=notes.filter(n=>n.content.includes(keyword));
  if(filtered.length===0)return '<div style="color:var(--text-light);font-size:12px;padding:8px;">暂无笔记</div>';
  let html='';
  filtered.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20).forEach(n=>{
    const book=DB.get('books',[]).find(b=>b.id===n.bookId);
    html+='<div class="list-item"><div class="list-item-left"><div style="font-size:12px;color:var(--text-secondary);">'+(book?book.title:'未知')+' · '+n.date+'</div><div style="font-size:13px;">'+n.content+'</div></div><button class="btn btn-del btn-xs" onclick="deleteNote(\''+n.id+'\')">删</button></div>';
  });
  return html;
}
function searchNotes(){
  const kw=document.getElementById('noteSearch').value;
  const notes=DB.get('readingNotes',[]);
  document.getElementById('noteList').innerHTML=renderNoteList(notes,kw);
}
function openAddNote(){
  const books=DB.get('books',[]);
  let html='<div style="font-weight:700;margin-bottom:12px;">添加阅读笔记</div>';
  html+='<select class="select" id="noteBookId" style="margin-bottom:8px;">';
  books.forEach(b=>{html+='<option value="'+b.id+'">'+b.title+'</option>';});
  html+='</select>';
  html+='<textarea class="input" id="noteContent" placeholder="笔记内容..." rows="3" style="margin-bottom:8px;resize:none;"></textarea>';
  html+='<button class="btn btn-primary btn-block" onclick="addNote()">💾 保存笔记</button>';
  openSheet(html);
}
function addNote(){
  const bookId=document.getElementById('noteBookId').value;
  const content=document.getElementById('noteContent').value.trim();
  if(!content){showToast('请输入笔记内容');return;}
  const notes=DB.get('readingNotes',[]);
  notes.push({id:DB.uid(),bookId:bookId,content:content,date:todayStr()});
  DB.set('readingNotes',notes);
  closeSheet();showToast('笔记已保存');renderContent();
}
function deleteNote(id){
  if(!confirm('确定删除？'))return;
  let notes=DB.get('readingNotes',[]);
  DB.set('readingNotes',notes.filter(n=>n.id!==id));
  renderContent();
}
function openNewContent(){
  let html='<div style="font-weight:700;margin-bottom:12px;">新建阅读内容</div>';
  html+='<input class="input" id="ctTitle" placeholder="标题" style="margin-bottom:8px;">';
  html+='<textarea class="input" id="ctContent" placeholder="粘贴或输入文本内容..." rows="6" style="margin-bottom:8px;resize:none;font-size:16px;"></textarea>';
  html+='<button class="btn btn-primary btn-block" onclick="saveContent()">保存</button>';
  openSheet(html);
}
function saveContent(){
  const title=document.getElementById('ctTitle').value.trim()||'未命名';
  const content=document.getElementById('ctContent').value.trim();
  if(!content){showToast('请输入内容');return;}
  const contents=DB.get('readingContents',[]);
  contents.push({id:DB.uid(),title:title,content:content,fontSize:16,bgColor:'white',currentPage:0,date:todayStr()});
  DB.set('readingContents',contents);
  closeSheet();showToast('已保存');renderContent();
}
function openReader(id){
  const contents=DB.get('readingContents',[]);
  const c=contents.find(c=>c.id===id);
  if(!c)return;
  // 简单分页显示
  const pageSize=500;
  const pages=[];
  for(let i=0;i<c.content.length;i+=pageSize){pages.push(c.content.substring(i,i+pageSize));}
  c.currentPage=Math.min(c.currentPage,pages.length-1);
  let html='<div style="font-weight:700;margin-bottom:12px;">📖 '+c.title+'</div>';
  html+='<div style="padding:16px;background:#FFFDF5;border-radius:12px;min-height:200px;font-size:16px;line-height:1.8;white-space:pre-wrap;margin-bottom:12px;">'+(pages[c.currentPage]||'')+'</div>';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;">';
  html+='<button class="btn btn-secondary btn-sm" onclick="prevPage(\''+id+'\','+c.currentPage+')"'+(c.currentPage<=0?' disabled':'')+'>← 上一页</button>';
  html+='<span style="font-size:13px;">'+(c.currentPage+1)+'/'+pages.length+'</span>';
  html+='<button class="btn btn-secondary btn-sm" onclick="nextPage(\''+id+'\','+c.currentPage+','+pages.length+')"'+(c.currentPage>=pages.length-1?' disabled':'')+'>下一页 →</button></div>';
  html+='<button class="btn btn-secondary btn-block" style="margin-top:8px;" onclick="closeSheet();renderContent();">关闭阅读</button>';
  openSheet(html);
}
function prevPage(id,current){
  const contents=DB.get('readingContents',[]);
  const c=contents.find(c=>c.id===id);
  if(c){c.currentPage=Math.max(0,current-1);DB.set('readingContents',contents);openReader(id);}
}
function nextPage(id,current,total){
  const contents=DB.get('readingContents',[]);
  const c=contents.find(c=>c.id===id);
  if(c){c.currentPage=Math.min(total-1,current+1);DB.set('readingContents',contents);openReader(id);}
}
function deleteContent(id){
  if(!confirm('确定删除？'))return;
  let contents=DB.get('readingContents',[]);
  DB.set('readingContents',contents.filter(c=>c.id!==id));
  renderContent();
}

function deleteStudyModule(){

function restoreStudy(){

}

// ===== 模块6：计划打卡 =====
function renderHabit(){
  const habits=DB.get('habits',[]);
  const today=todayStr();

  let html='<div class="card"><div class="card-header"><span class="em">📋</span>今日打卡</div>';
  const activeHabits=habits.filter(h=>!h.isPaused);
  if(activeHabits.length===0){html+='<div class="empty-state"><span class="em">📋</span><div>还没有计划，点击下方创建</div></div>';}
  else{
    activeHabits.forEach(h=>{
      const checkins=h.checkins||[];
      const doneToday=checkins.some(c=>c.date===today);
      const streak=getHabitStreak(h);
      html+='<div class="list-item" style="cursor:pointer;" onclick="checkinHabit(\''+h.id+'\')">';
      html+='<div class="list-item-left"><div class="list-item-title">'+(doneToday?'✅ ':'⬜ ')+h.name+'</div><div class="list-item-sub">连续 '+streak+' 天 · '+h.frequency+'</div></div>';
      html+='<div class="list-item-right">';
      if(!doneToday)html+='<button class="btn btn-primary btn-xs" onclick="event.stopPropagation();checkinHabit(\''+h.id+'\')">打卡</button>';
      html+='<button class="btn btn-del btn-xs" onclick="event.stopPropagation();togglePauseHabit(\''+h.id+'\')">'+(h.isPaused?'▶':'⏸')+'</button>';
      html+='<button class="btn btn-del btn-xs" onclick="event.stopPropagation();deleteHabit(\''+h.id+'\')">删</button></div></div>';
    });
  }

  // 暂停的计划
  const paused=habits.filter(h=>h.isPaused);
  if(paused.length>0){
    html+='<div style="margin-top:8px;font-size:12px;color:var(--text-secondary);">已暂停:</div>';
    paused.forEach(h=>{
      html+='<div class="list-item"><div class="list-item-left"><div class="list-item-title">⏸ '+h.name+'</div></div>';
      html+='<div class="list-item-right"><button class="btn btn-xs btn-secondary" onclick="togglePauseHabit(\''+h.id+'\')">▶ 恢复</button>';
      html+='<button class="btn btn-xs btn-del" onclick="deleteHabit(\''+h.id+'\')">删</button></div></div>';
    });
  }
  html+='</div>';

  // 热力图
  html+='<div class="card"><div class="card-header"><span class="em">🔥</span>打卡热力图 (近30天)</div>'+renderHeatmap(habits)+'</div>';

  // 创建计划
  html+='<div class="card"><div class="card-header"><span class="em">➕</span>创建计划</div>';
  html+='<input class="input" id="habitName" placeholder="计划名称" style="margin-bottom:8px;">';
  html+='<select class="select" id="habitFreq" style="margin-bottom:8px;">';
  html+='<option value="每天">每天</option><option value="每周5次">每周5次</option><option value="每周3次">每周3次</option><option value="每周2次">每周2次</option><option value="每周1次">每周1次</option><option value="自定义">自定义</option></select>';
  html+='<button class="btn btn-primary btn-block" onclick="createHabit()">创建计划</button></div>';

  return html;
}

function getHabitStreak(habit){
  const checkins=(habit.checkins||[]).map(c=>c.date).sort().reverse();
  if(checkins.length===0)return 0;
  let streak=0;
  let d=new Date(todayStr());
  for(let i=0;;i++){
    if(checkins.includes(d.toISOString().split('T')[0])){streak++;d.setDate(d.getDate()-1);}else break;
  }
  return streak;
}

function checkinHabit(id){
  const habits=DB.get('habits',[]);
  const h=habits.find(h=>h.id===id);
  if(!h)return;
  if(!h.checkins)h.checkins=[];
  const today=todayStr();
  if(h.checkins.some(c=>c.date===today))return;
  h.checkins.push({date:today,isDone:true});
  DB.set('habits',habits);
  showToast(h.name+' 打卡成功! ✅');
  renderContent();
}

function createHabit(){
  const name=document.getElementById('habitName').value.trim();
  const freq=document.getElementById('habitFreq').value;
  if(!name){showToast('请输入计划名称');return;}
  const habits=DB.get('habits',[]);
  habits.push({id:DB.uid(),name:name,frequency:freq,startDate:todayStr(),endDate:'',isPaused:false,checkins:[]});
  DB.set('habits',habits);
  showToast('计划已创建');
  renderContent();
}

function togglePauseHabit(id){
  const habits=DB.get('habits',[]);
  const h=habits.find(h=>h.id===id);
  if(h){h.isPaused=!h.isPaused;DB.set('habits',habits);renderContent();}
}

function deleteHabit(id){
  if(!confirm('确定删除这个计划？'))return;
  let habits=DB.get('habits',[]);
  DB.set('habits',habits.filter(h=>h.id!==id));
  renderContent();
}

function renderHeatmap(habits){
  const allCheckins=new Set();
  habits.forEach(h=>{(h.checkins||[]).forEach(c=>allCheckins.add(c.date));});
  let html='<div class="heatmap">';
  const today=new Date();
  for(let i=29;i>=0;i--){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const ds=d.toISOString().split('T')[0];
    const count=[...allCheckins].filter(c=>c===ds).length;
    let cls='heatmap-cell';
    if(count>=4)cls+=' l4';else if(count>=3)cls+=' l3';else if(count>=2)cls+=' l2';else if(count>=1)cls+=' l1';
    html+='<div class="'+cls+'" title="'+ds+' ('+count+'次)"></div>';
  }
  html+='</div>';
  return html;
}

// ===== 模块7：心情日记 =====
function renderMood(){
  const today=todayStr();
  const records=DB.get('moodRecords',[]);
  const tags=DB.get('moodTags',[]);

  const moodLevels=[
    {emoji:'😄',label:'开心',en:'happy'},
    {emoji:'😊',label:'不错',en:'good'},
    {emoji:'😐',label:'一般',en:'neutral'},
    {emoji:'😢',label:'低落',en:'low'},
    {emoji:'😫',label:'很差',en:'bad'}
  ];

  let html='<div class="card"><div class="card-header"><span class="em">😊</span>记录今天的心情</div>';
  html+='<div class="mood-picker" id="moodPicker">';
  moodLevels.forEach(m=>{
    html+='<div class="mood-item" data-mood="'+m.en+'" onclick="selectMood(\''+m.en+'\')">'+m.emoji+'</div>';
  });
  html+='</div>';
  html+='<textarea class="input" id="moodDiary" placeholder="今天想写点什么..." rows="3" style="margin-bottom:8px;resize:none;"></textarea>';
  html+='<div style="margin-bottom:8px;"><span style="font-size:12px;">标签: </span>';
  const allTags=['工作','社交','运动','学习','美食','旅行','家人','朋友','独处','阅读',...tags];
  allTags.forEach(t=>{html+='<span class="tag tag-pink" style="cursor:pointer;" onclick="toggleMoodTag(this,\''+t+'\')">'+t+'</span>';});
  html+='</div>';
  html+='<input class="input" id="newMoodTag" placeholder="添加自定义标签" style="margin-bottom:8px;width:60%;display:inline;">';
  html+='<button class="btn btn-xs btn-secondary" onclick="addMoodTag()">添加</button>';
  html+='<button class="btn btn-primary btn-block" onclick="saveMood()">💾 记录心情</button></div>';

  // 心情日历
  html+='<div class="card"><div class="card-header"><span class="em">📅</span>心情日历</div>';
  html+=renderMoodCalendar(records)+'</div>';

  // 心情统计
  const stats=getMoodStats(records,30);
  html+='<div class="card"><div class="card-header"><span class="em">📊</span>近30天心情分布</div>';
  stats.forEach(s=>{
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:13px;">';
    html+='<span>'+s.emoji+'</span><span style="min-width:36px;">'+s.label+'</span>';
    html+='<div class="progress-bar" style="flex:1;"><div class="progress-fill" style="width:'+s.pct+'%;background:'+s.color+';"></div></div>';
    html+='<span style="min-width:32px;text-align:right;">'+s.count+'次</span></div>';
  });
  html+='</div>';

  // 日记回顾
  html+='<div class="card"><div class="card-header"><span class="em">📝</span>日记回顾</div>';
  html+='<select class="select" id="moodFilter" onchange="renderMoodHistory()" style="margin-bottom:8px;">';
  html+='<option value="">全部分类</option>';
  moodLevels.forEach(m=>{html+='<option value="'+m.en+'">'+m.emoji+' '+m.label+'</option>';});
  html+='</select><input class="input" id="moodSearch" placeholder="搜索日记关键词..." oninput="renderMoodHistory()" style="margin-bottom:8px;">';
  html+='<div id="moodHistoryList">'+renderMoodList(records,'','')+'</div></div>';

  return html;
}

let selectedMood='';
let selectedMoodTags=[];
function selectMood(m){selectedMood=m;document.querySelectorAll('.mood-item').forEach(el=>el.classList.toggle('selected',el.dataset.mood===m));}
function toggleMoodTag(el,tag){el.classList.toggle('selected');const i=selectedMoodTags.indexOf(tag);if(i>=0)selectedMoodTags.splice(i,1);else selectedMoodTags.push(tag);}
function addMoodTag(){
  const tag=document.getElementById('newMoodTag').value.trim();
  if(!tag)return;
  let tags=DB.get('moodTags',[]);
  if(!tags.includes(tag)){tags.push(tag);DB.set('moodTags',tags);}
  document.getElementById('newMoodTag').value='';
  renderContent();
}
function saveMood(){
  const moodLevels={happy:'😄开心',good:'😊不错',neutral:'😐一般',low:'😢低落',bad:'😫很差'};
  const moodEmojis={happy:'😄',good:'😊',neutral:'😐',low:'😢',bad:'😫'};
  if(!selectedMood){showToast('请选择心情');return;}
  const diary=document.getElementById('moodDiary').value.trim();
  const records=DB.get('moodRecords',[]);
  records.push({id:DB.uid(),level:selectedMood,emoji:moodEmojis[selectedMood],diary:diary,tags:selectedMoodTags,date:todayStr(),time:nowStr()});
  DB.set('moodRecords',records);
  selectedMood='';selectedMoodTags=[];
  showToast('心情已记录 💗');
  renderContent();
}
function renderMoodCalendar(records){
  const today=new Date();
  const y=today.getFullYear(),m=today.getMonth();
  const firstDay=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const moodColors={happy:'#FFB6C1',good:'#FFD1DC',neutral:'#E8E8E8',low:'#C8C8C8',bad:'#AAAAAA'};
  const weekdays=['日','一','二','三','四','五','六'];

  let html='<div class="cal-grid">';
  weekdays.forEach(d=>{html+='<div class="cal-day-header">'+d+'</div>';});
  for(let i=0;i<firstDay;i++){html+='<div></div>';}
  for(let d=1;d<=daysInMonth;d++){
    const ds=y+'-'+(m+1).toString().padStart(2,'0')+'-'+d.toString().padStart(2,'0');
    const rec=records.find(r=>r.date===ds);
    let style='';
    if(rec)style='background:'+moodColors[rec.level]+';color:#FFF;';
    if(d===today.getDate())style+='border:2px solid var(--pink-deep);';
    html+='<div class="cal-day" style="'+style+'">'+d+'</div>';
  }
  html+='</div>';
  return html;
}
function getMoodStats(records,days){
  const start=new Date();start.setDate(start.getDate()-days);
  const recent=records.filter(r=>r.date>=start.toISOString().split('T')[0]);
  const levels=[
    {en:'happy',emoji:'😄',label:'开心',color:'#FFB6C1'},
    {en:'good',emoji:'😊',label:'不错',color:'#FFD1DC'},
    {en:'neutral',emoji:'😐',label:'一般',color:'#E8E8E8'},
    {en:'low',emoji:'😢',label:'低落',color:'#C8C8C8'},
    {en:'bad',emoji:'😫',label:'很差',color:'#AAAAAA'}
  ];
  const total=recent.length||1;
  return levels.map(l=>{
    const count=recent.filter(r=>r.level===l.en).length;
    return {...l,count:count,pct:Math.round(count/total*100)};
  });
}
function renderMoodList(records,filter,keyword){
  let filtered=records;
  if(filter)filtered=filtered.filter(r=>r.level===filter);
  if(keyword)filtered=filtered.filter(r=>r.diary.includes(keyword));
  filtered.sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time));
  if(filtered.length===0)return '<div class="empty-state"><span class="em">📝</span><div>没有找到记录</div></div>';
  let html='';
  filtered.slice(0,30).forEach(r=>{
    html+='<div class="list-item"><div class="list-item-left"><div style="font-weight:600;">'+r.emoji+' '+r.diary.substring(0,50)+(r.diary.length>50?'...':'')+'</div><div style="font-size:11px;color:var(--text-secondary);">'+r.date+' '+(r.time||'')+(r.tags&&r.tags.length?' · '+r.tags.join(' '):'')+'</div></div>';
    html+='<div class="list-item-right"><button class="btn btn-del btn-xs" onclick="deleteMood(\''+r.id+'\')">删</button></div></div>';
  });
  return html;
}
function deleteMood(id){
  if(!confirm('确定删除？'))return;
  let records=DB.get('moodRecords',[]);
  DB.set('moodRecords',records.filter(r=>r.id!==id));
  renderContent();
}
function renderMoodHistory(){
  const filter=document.getElementById('moodFilter').value;
  const kw=document.getElementById('moodSearch')?.value||'';
  const records=DB.get('moodRecords',[]);
  document.getElementById('moodHistoryList').innerHTML=renderMoodList(records,filter,kw);
}

// ===== 数据导出/导入 =====
function exportData(){
  const data={};
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(key.startsWith('hk_')){
      data[key]=JSON.parse(localStorage.getItem(key));
    }
  }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='HKWorkbench_backup_'+todayStr()+'.json';
  a.click();URL.revokeObjectURL(url);
  showToast('数据已导出');
}

function importData(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      Object.entries(data).forEach(([k,v])=>{
        if(k.startsWith('hk_'))localStorage.setItem(k,JSON.stringify(v));
      });
      showToast('数据已导入');
      renderContent();
      renderSettings();
    }catch(err){showToast('导入失败，文件格式错误');}
  };
  reader.readAsText(file);
  input.value='';
}

    ]);

  // 渲染初始内容
